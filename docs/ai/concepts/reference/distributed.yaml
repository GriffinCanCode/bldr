topic: distributed
category: concepts
summary: "Distributed Builds - Scale builds across a cluster with REAPI compatibility"
definition: |
  Distributed builds allow you to offload build actions to a cluster of machines,
  significantly speeding up large builds by utilizing shared compute resources.
  Full Bazel REAPI wire compatibility enables integration with existing infrastructure.

key_points:
  - "Remote execution: Run compilers/tests on remote workers"
  - "Scalability: Scale from one to hundreds of cores"
  - "Transparency: Works without code changes"
  - "REAPI v2: Full Bazel Remote Execution API wire compatibility"
  - "Transport: HTTP/1.1 (default) or gRPC (full REAPI, streaming)"
  - "Integration: Works with BuildBuddy, BuildBarn, Buildfarm, Google RBE"
  - "Hash translation: Automatic BLAKE3 ↔ SHA256 for REAPI servers"
  - "Profile-Guided: Uses historical data to schedule expensive actions early"
  - "Work-Stealing: Efficient load balancing across workers"

transport_options:
  http:
    pros:
      - "No external dependencies"
      - "Simple configuration"
      - "Good for Builder-native clusters"
    cons:
      - "No streaming support"
      - "Limited REAPI compatibility"
  grpc:
    pros:
      - "Full REAPI wire compatibility"
      - "Bidirectional streaming"
      - "Automatic retry with backoff"
      - "Deadline propagation"
      - "Works with all REAPI backends"
    cons:
      - "Slightly more complex setup"
    note: "Pure D implementation - no grpc-core required"

usage_examples:
  - description: "Configure remote execution with HTTP (default)"
    code: |
      remote:
        address: "http://build-farm.example.com:9000"
  - description: "Configure remote execution with gRPC"
    code: |
      remote:
        address: "grpc://build-farm.example.com:8980"
        transport: grpc
  - description: "Configure gRPC with TLS"
    code: |
      remote:
        address: "grpcs://build-farm.example.com:8980"
        tls:
          cert: "/path/to/client.crt"
          key: "/path/to/client.key"
          ca: "/path/to/ca.crt"
  - description: "Connect to BuildBuddy"
    code: |
      remote:
        address: "grpcs://remote.buildbuddy.io"
        api_key: "your-api-key"
  - description: "Programmatic gRPC client"
    code: |
      import engine.distributed.protocol.grpc;
      
      auto config = GrpcConfig.insecure("coordinator:9000");
      auto transport = new GrpcTransport(config);
      if (transport.connect().isOk) {
          auto result = transport.execute(actionRequest);
      }

compatible_backends:
  - name: BuildBuddy
    url: "https://buildbuddy.io"
    type: "Commercial/OSS"
  - name: BuildBarn
    url: "https://github.com/buildbarn"
    type: "Open Source"
  - name: Buildfarm
    url: "https://github.com/bazelbuild/bazel-buildfarm"
    type: "Open Source"
  - name: Google RBE
    url: "https://cloud.google.com/remote-build-execution"
    type: "Commercial"
  - name: Engflow
    url: "https://engflow.com"
    type: "Commercial"

architecture: |
  ┌─────────────────────────────────────────────────────────┐
  │                    BUILD CLIENT                          │
  │  ┌────────────┐   ┌────────────┐   ┌────────────┐      │
  │  │   Graph    │──▶│ Coordinator│──▶│  Transport │      │
  │  │  Analysis  │   │  Interface │   │   Layer    │      │
  │  └────────────┘   └────────────┘   └──────┬─────┘      │
  └───────────────────────────────────────────┼────────────┘
                                              │
                          ┌───────────────────┴────────────┐
                          │                                 │
                          ▼                                 ▼
            ┌──────────────────────┐        ┌──────────────────────┐
            │   REAPI BACKEND       │        │    ARTIFACT STORE    │
            │ (BuildBuddy, etc.)   │        │  (Content-Addressed) │
            └──────────────────────┘        └──────────────────────┘

related: [remote-cache, hermetic, action-cache, grpc-transport, reapi-v2, remote-execution]

location: "source/engine/distributed/"

next_steps: |
  - Set up a REAPI-compatible build farm
  - Configure remote endpoint in builder.yml
  - Use gRPC transport for streaming and deadline propagation
  - bldr explain grpc-transport
  - bldr explain reapi-v2
