topic: distributed
category: concepts
summary: "Distributed Builds - Scale builds across a cluster"
definition: |
  Distributed builds allow you to offload build actions to a cluster of machines,
  significantly speeding up large builds by utilizing shared compute resources.

key_points:
  - "Remote execution: Run compilers/tests on remote workers"
  - "Scalability: Scale from one to hundreds of cores"
  - "Transparency: Works without code changes"
  - "REAPI v2: Wire-compatible with Bazel Remote Execution API"
  - "Transport: Supports HTTP/1.1 (default), gRPC, or REAPI v2"
  - "Integration: Works with BuildBuddy, BuildBarn, Google RBE"
  - "Hash translation: Automatic BLAKE3 ↔ SHA256 for REAPI servers"
  - "Profile-Guided: Uses historical data to schedule expensive actions early"

usage_examples:
  - description: "Configure remote execution with HTTP (default)"
    code: |
      remote:
        address: "http://build-farm.example.com:9000"
  - description: "Configure remote execution with gRPC"
    code: |
      remote:
        address: "grpc://build-farm.example.com:8980"
        transport: grpc
  - description: "Configure gRPC with TLS"
    code: |
      remote:
        address: "grpcs://build-farm.example.com:8980"
        tls:
          cert: "/path/to/client.crt"
          key: "/path/to/client.key"
          ca: "/path/to/ca.crt"

related: [remote-cache, hermetic, action-cache, grpc-transport, reapi-v2]

next_steps: |
  - Set up a REAPI-compatible build farm
  - Configure remote endpoint in builder.yml
  - Use REAPI v2 adapter for BuildBuddy/BuildBarn integration
  - Use gRPC for streaming and deadline propagation

