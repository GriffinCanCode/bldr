topic: persistent-workers
category: reference
summary: "Persistent Worker Protocol - Keep JVM/TypeScript compilers warm across builds for 10-50x faster compilation"
definition: |
  Bazel-compatible persistent worker protocol that keeps compiler processes running
  across builds (not just actions). Workers progress through warmth levels as JIT
  optimizes, providing 10-50x speedup. Includes automatic memory monitoring with
  OOM prevention and warmth-aware recycling.

key_points:
  - "Workers persist across builds for true warmth (JVM startup: 2-3s → milliseconds)"
  - "Warmth levels: Cold → Warming → Warm → Hot (progressively faster)"
  - "Automatic OOM detection with proactive restart before crash"
  - "Warmth-aware eviction: cold workers evicted first, hot workers preserved"
  - "Protocol: newline-delimited JSON over stdin/stdout (Bazel-compatible)"
  - "Supports: javac, kotlinc, scalac, groovyc, tsc, swc, esbuild, bun"

warmth_levels:
  - level: "Cold"
    description: "Just started, no JIT optimization"
    speedup: "1x (baseline)"
    
  - level: "Warming"
    description: "Initial compilations done, JIT warming up"
    speedup: "3x"
    
  - level: "Warm"
    description: "Steady state, good performance"
    speedup: "10-20x"
    
  - level: "Hot"
    description: "Fully optimized, peak performance"
    speedup: "20-50x"

performance_comparison:
  - compiler: "javac"
    cold_start: "~800ms"
    warm_worker: "~50ms"
    hot_worker: "~15ms"
    speedup: "16-50x"
  - compiler: "kotlinc"
    cold_start: "~2000ms"
    warm_worker: "~100ms"
    hot_worker: "~30ms"
    speedup: "20-67x"
  - compiler: "scalac"
    cold_start: "~1500ms"
    warm_worker: "~80ms"
    hot_worker: "~25ms"
    speedup: "19-60x"
  - compiler: "tsc"
    cold_start: "~400ms"
    warm_worker: "~30ms"
    hot_worker: "~10ms"
    speedup: "13-40x"
  - compiler: "swc"
    cold_start: "~50ms"
    warm_worker: "~5ms"
    hot_worker: "~2ms"
    speedup: "10-25x"

protocol:
  work_request:
    description: "Sent to worker stdin as newline-delimited JSON"
    fields:
      - "request_id: Unique ID for correlation"
      - "arguments: Compiler arguments"
      - "inputs: Input files with digests"
      - "sandbox_dir: Hermetic sandbox directory"
      - "cancel: Cancel in-flight request"

  work_response:
    description: "Received from worker stdout as newline-delimited JSON"
    fields:
      - "request_id: Correlates to request"
      - "exit_code: 0 for success"
      - "output: Combined stdout/stderr"
      - "execution_time_ms: Actual execution time"
      - "outputs: Output files with digests"

architecture:
  components:
    - "PersistentWorkerService: High-level service managing all workers"
    - "WorkerPool: Pool coordination with recycler and memory monitor"
    - "WorkerRecycler: Warmth tracking and recycling policy (SOC)"
    - "WorkerMemoryMonitor: Memory metrics and OOM detection (SOC)"
    - "WorkerFactory: Creates workers for specific compilers"
    - "HealthMonitor: Memory-aware health monitoring with OOM restart"
    - "StdioTransport: Bazel-compatible stdio communication"

  soc_design:
    description: "Strict Separation of Concerns"
    modules:
      - "recycler.d: Warmth tracking only - no memory logic"
      - "memory.d: OOM detection only - no recycling decisions"
      - "manager.d: Coordination only - doesn't implement either"

  lifecycle:
    - "Workers persist across builds (not just actions)"
    - "Workers progress through warmth levels with usage"
    - "Hot workers get extended idle time (configurable bonus)"
    - "Cold workers evicted first when capacity needed"
    - "OOM risk triggers immediate restart before crash"
    - "Max request count triggers recycling (prevent memory leaks)"

usage_examples:
  - description: "Initialize with recycling enabled"
    code: |
      import engine.workers;
      
      WorkerServiceConfig config;
      config.poolConfig.enableRecycling = true;
      config.poolConfig.enableMemoryMonitor = true;
      config.poolConfig.persistAcrossBuilds = true;
      config.poolConfig.idleTimeout = minutes(10);
      initWorkerService(config);

  - description: "Configure recycling policy"
    code: |
      config.poolConfig.recyclingPolicy.preferWarmWorkers = true;
      config.poolConfig.recyclingPolicy.keepHotAcrossBuilds = true;
      config.poolConfig.recyclingPolicy.hotWorkerBonus = minutes(5);
      config.poolConfig.recyclingPolicy.maxRequestsBeforeRecycle = 10_000;

  - description: "Configure memory monitoring"
    code: |
      config.poolConfig.memoryThresholds.normalMax = 0.70f;
      config.poolConfig.memoryThresholds.elevatedMax = 0.85f;
      config.poolConfig.memoryThresholds.highMax = 0.95f;  // OOM restart

  - description: "Get warmth statistics"
    code: |
      auto service = getWorkerService();
      auto metrics = service.getMetrics();
      
      writeln("Warm workers: ", metrics.warmWorkers);
      writeln("Hot workers: ", metrics.hotWorkers);
      writeln("Warmth speedup: ", metrics.warmthSpeedup, "x");
      writeln("Workers at OOM risk: ", metrics.workersAtOOMRisk);

  - description: "Access recycler directly"
    code: |
      auto recycler = pool.getRecycler();
      auto stats = recycler.getStats();
      
      writeln("Cold: ", stats.byLevel[WarmthLevel.Cold]);
      writeln("Warm: ", stats.byLevel[WarmthLevel.Warm]);
      writeln("Hot: ", stats.byLevel[WarmthLevel.Hot]);
      writeln("Estimated speedup: ", recycler.estimatedSpeedup(), "x");

  - description: "Check memory pressure"
    code: |
      auto memMonitor = pool.getMemoryMonitor();
      
      if (memMonitor.isOOMRisk(workerId)) {
          writeln("Worker at memory risk!");
      }
      
      auto atRisk = memMonitor.getAtRisk();
      writeln("Workers at risk: ", atRisk.length);

configuration:
  pool:
    max_workers_per_type: "Maximum concurrent workers per compiler type (default: 4)"
    idle_timeout: "Evict idle workers after this duration (default: 10 minutes)"
    max_requests_per_worker: "Recycle worker after N requests (default: 10,000)"
    enable_recycling: "Enable warmth-aware recycling (default: true)"
    enable_memory_monitor: "Enable OOM detection (default: true)"
    persist_across_builds: "Keep warm workers between builds (default: true)"

  recycling:
    prefer_warm_workers: "Select warmest available worker (default: true)"
    keep_hot_across_builds: "Preserve hot workers between builds (default: true)"
    hot_worker_bonus: "Extra idle time for hot workers (default: 5 minutes)"
    min_keep_warm_time: "Minimum time before evicting warm worker (default: 2 minutes)"
    max_idle_time: "Maximum idle time before eviction (default: 10 minutes)"

  memory:
    normal_max: "Normal pressure threshold (default: 70%)"
    elevated_max: "Elevated pressure threshold (default: 85%)"
    high_max: "High pressure threshold, triggers OOM restart (default: 95%)"
    poll_interval: "Memory polling interval (default: 5 seconds)"

  jvm:
    max_heap_mb: "JVM max heap size (default: 2048 MB)"
    jvm_args: "Additional JVM arguments (-XX:+UseG1GC, etc.)"
    java_home: "Override JAVA_HOME"

  typescript:
    max_old_space_mb: "Node.js max old space size (default: 4096 MB)"
    incremental: "Enable TypeScript incremental compilation (default: true)"
    node_path: "Override Node.js path"

health_monitoring:
  features:
    - "Memory-aware health checks"
    - "Warmth tracking in health results"
    - "Automatic OOM restart (configurable)"
    - "Prefer warm workers on restart"
    - "Graceful degradation for warm workers under memory pressure"

  memory_pressure:
    - level: "Normal"
      threshold: "< 70%"
      action: "Continue normally"
    - level: "Elevated"
      threshold: "70-85%"
      action: "Log warning"
    - level: "High"
      threshold: "85-95%"
      action: "Trigger restart (warm workers deferred)"
    - level: "Critical"
      threshold: "> 95%"
      action: "Immediate restart"

  alerts:
    - severity: "Info"
      condition: "Worker successfully recovered"
    - severity: "Warning"
      condition: "Worker health check failed / Memory elevated"
    - severity: "Error"
      condition: "Worker process died"
    - severity: "Critical"
      condition: "Worker exceeded failure threshold / OOM imminent"

integration:
  language_handlers:
    - "JavaHandler: Uses JavaWorkerIntegration for javac"
    - "KotlinHandler: Uses KotlinWorkerIntegration for kotlinc"
    - "TypeScriptHandler: Uses TypeScriptWorkerIntegration for tsc"

  build_system:
    - "Initialize workers during engine startup"
    - "Workers persist across builds automatically"
    - "Warmth-aware selection for optimal performance"
    - "OOM prevention keeps builds stable"
    - "Fallback to cold compilation is transparent"

related: [java-support, performance, caching, remote-execution, distributed]

source_files:
  - "source/engine/workers/protocol/types.d"
  - "source/engine/workers/protocol/transport.d"
  - "source/engine/workers/pool/manager.d"
  - "source/engine/workers/pool/recycler.d"
  - "source/engine/workers/pool/memory.d"
  - "source/engine/workers/jvm/worker.d"
  - "source/engine/workers/typescript/worker.d"
  - "source/engine/workers/service.d"
  - "source/engine/workers/integration.d"
  - "source/engine/workers/health.d"

next_steps: |
  - Enable persistent workers with recycling in build configuration
  - Monitor warmth distribution for optimization insights
  - Configure memory thresholds based on available RAM
  - Tune idle timeout for build patterns (longer = more warmth preservation)
  - Use hot worker bonus for continuous development workflows
