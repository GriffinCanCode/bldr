topic: incremental-compilation
category: concepts
summary: "Incremental Compilation & Linking - Speeding up rebuilds"
definition: |
  Deep dive into how Builder handles incremental compilation and linking for languages that support it.
  This goes beyond file-level caching to artifact reuse within a single target, including
  incremental linking for faster link phases.

key_points:
  - "State preservation: Keeps compiler state hot if possible"
  - "Partial rebuilds: Only recompiles changed functions/modules"
  - "Dependency analysis: Accurate pruning of downstream rebuilds"
  - "Incremental linking: Platform-native linker support (LLD, MSVC, Gold)"
  - "Link speedup: 5-15x faster linking for small changes"

incremental_linking:
  description: |
    Incremental linking tracks object file changes and enables partial re-linking
    when only some objects have changed. Supported languages include C++, Rust,
    Zig, D, Swift, Kotlin/Native, Scala Native, OCaml, and Haskell.
  
  configuration: |
    workspace("myproject") {
        incremental: true;           // Compilation
        incrementalLinking: true;    // Linking
    }

usage_examples:
  - description: "Automatic for supported languages"
  - description: "Enable incremental linking"
    code: |
      workspace("cpp-project") {
          incremental: true;
          incrementalLinking: true;
      }

related: [incremental, caching, languages, linking]

next_steps: |
  - Ensure your code structure allows for modular compilation
  - Enable incrementalLinking for large compiled projects

