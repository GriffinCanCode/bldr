topic: build-graph
category: concepts
summary: "Build Graph - The core data structure"
definition: |
  Conceptual explanation of the Directed Acyclic Graph (DAG) that represents the build.
  Nodes are targets/actions, edges are dependencies. Graph can be persisted to SQLite
  for crash safety and efficient queries without loading full graph into memory.

key_points:
  - "DAG: No circular dependencies allowed"
  - "Topological sort: Determines build order"
  - "Traversal: How Builder walks the graph"
  - "Persistence: SQLite with WAL mode for crash safety"
  - "Queries: Transitive deps/dependents without full load"

usage_examples:
  - command: "bldr graph //target"
    description: "Visualize the graph"

related: [bldrquery, targets, dependencies, graph-persistence, critical-path]

next_steps: |
  - Use 'bldr query' to explore the graph
  - See 'bldr explain graph-persistence' for SQLite storage

